# set-option -a terminal-features 'xterm-256color:RGB'
set-option -a terminal-features '*:RGB'

set-option -g base-index 1
set-option -g pane-base-index 1

bind \\ move-window -r

set-option -g mouse off

set-option -g history-limit 100000

set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-option -s focus-events on
set-option -s escape-time 0

set-option -g status-interval 5

bind-key C-p previous-window
bind-key C-n next-window

# Colors: catppuccin (mocha), matching Neovim's built-in colorscheme.
# Highlight group each value is taken from is noted on the right.
set-option -g status-style 'fg=#cdd6f4,bg=#11111b'                          # StatusLine
set-option -g status-left-style 'fg=#89b4fa,bold'                           # Title
set-option -g status-right-style 'fg=#9399b2'                               # Comment
set-option -g window-status-style 'fg=#6c7086,bg=#11111b'                   # TabLine
set-option -g window-status-current-style 'fg=#cdd6f4,bg=#1e1e2e'           # TabLineSel
set-option -g window-status-last-style 'fg=#9399b2,bg=#11111b'              # Comment
set-option -g window-status-activity-style 'fg=#f9e2af,bg=#11111b'          # WarningMsg
set-option -g window-status-bell-style 'fg=#f38ba8,bg=#11111b,bold'         # ErrorMsg
set-option -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '
set-option -g window-status-current-format ' #I:#W#{?window_flags,#{window_flags},} '
set-option -g window-status-separator ''

set-option -g pane-border-style 'fg=#45475a'                                # LineNr
set-option -g pane-active-border-style 'fg=#b4befe'                         # CursorLineNr
set-option -g display-panes-colour '#45475a'                                # LineNr
set-option -g display-panes-active-colour '#b4befe'                         # CursorLineNr

set-option -g message-style 'fg=#cdd6f4,bg=#181825,bold'                    # ModeMsg
set-option -g message-command-style 'fg=#89b4fa,bg=#181825'                 # Question
set-option -g mode-style 'bg=#45475a'                                       # Visual
set-option -g copy-mode-match-style 'fg=#cdd6f4,bg=#3e5767'                 # Search
set-option -g copy-mode-current-match-style 'fg=#cdd6f4,bg=#89556b'         # CurSearch
set-option -g copy-mode-mark-style 'fg=#cdd6f4,bg=#52476a'                  # QuickFixLine

set-option -g menu-style 'fg=#9399b2,bg=#181825'                            # Pmenu
set-option -g menu-selected-style 'fg=#cdd6f4,bg=#313244,bold'              # PmenuSel
set-option -g menu-border-style 'fg=#6c7086,bg=#181825'                     # NonText
set-option -g popup-style 'fg=#cdd6f4,bg=#181825'                           # Pmenu
set-option -g popup-border-style 'fg=#6c7086,bg=#181825'                    # NonText

set-option -g clock-mode-colour '#89b4fa'                                   # Function

